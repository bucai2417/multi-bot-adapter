name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version and verify tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No release tag provided"
            exit 1
          fi

          VERSION=$(python scripts/package_skill.py --print-version)
          TAG_VERSION="${TAG#v}"

          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match SKILL.md version $VERSION"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Validate skill
        run: python scripts/package_skill.py --check-only

      - name: Build packages
        run: python scripts/package_skill.py --out dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multi-bot-adapter-${{ steps.meta.outputs.version }}
          path: dist/*
          retention-days: 14

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "multi-bot-adapter $VERSION"
          else
            gh release create "$TAG" dist/* \
              --title "multi-bot-adapter $VERSION" \
              --generate-notes \
              --verify-tag
          fi
